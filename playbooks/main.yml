# negotium personal server.
# Steps run in dependency order; each ends with a verify task.
#   (Strata, the local model, is installed by tooling-playbooks.)
#   2. presidio — PII masking
#   3. litellm  — model gateway (needs Strata and 2)
#   4. speech   — Whisper + Kokoro
#   5. home assistant (needs 3, 4)
#   6. openclaw (needs 3, Twilio, privacy.com)

- name: negotium
  hosts: all
  vars:
    presidio_version: "latest"
    docker_dir: /home/admin/docker
    litellm_version: "main-stable"
    strata_model: "qwen3.8-flash-next-coder-iq1_m"
    qwen_model: "qwen3.8-max"
    dashscope_base_url: "https://ws-4hta3ygc29v7zpo7.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
    tailscale_ip: "100.92.147.94"
    pii_entities_not_masked: [LOCATION, DATE_TIME, NRP, URL]
    tailscale_hostname: "arketyped.tail5a2469.ts.net"
    speaches_version: "latest-cpu"
    whisper_model: "Systran/faster-distil-whisper-small.en"
    kokoro_model: "speaches-ai/Kokoro-82M-v1.0-ONNX"
    kokoro_voice: "af_heart"
    ha_version: "stable"
    ha_owner_name: "Joe"
    ha_owner_username: "joe"
    wyoming_openai_version: "latest"
    timezone: "America/Chicago"
    openclaw_version: "latest"
  vars_files:
    - secrets.yml

  become: yes
  tasks:
    - name: Step 2 — Presidio
      include_tasks: presidio.yml
      tags: [presidio]

    - name: Step 3 — LiteLLM
      include_tasks: litellm.yml
      tags: [litellm]

    - name: Step 4 — Speech (Whisper + Kokoro)
      include_tasks: speech.yml
      tags: [speech]

    - name: Step 5 — Home Assistant
      include_tasks: home_assistant.yml
      tags: [home_assistant]

    - name: Step 6 — OpenClaw
      include_tasks: openclaw.yml
      tags: [openclaw]
