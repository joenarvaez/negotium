# negotium personal server.
# Steps run in dependency order; each ends with a verify task.
#   (Ollama, the local model server, is installed by tooling-playbooks.)
#   2. presidio — PII masking
#   3. litellm  — model gateway (needs Ollama and 2)
#   4. speech   — Whisper + Kokoro
#   5. home assistant (needs 3, 4)
#   6. openclaw (needs 3, Twilio, privacy.com)
#   7. vitals   — Health Connect webhook for the health coach
#   8. comfyui  — image generation on GPU 1

- name: negotium
  hosts: all
  vars:
    presidio_version: "latest"
    docker_dir: /home/admin/docker
    # Reason: pinned because templates/litellm-presidio.py is this version's file plus
    # BerriAI/litellm PR #32014 (unmask tool-call arguments). Drop both once it merges.
    litellm_version: "v1.106.6"
    # Local model in Ollama for passwords and quick private tasks (system_adr.md §3, §4).
    # Reason: the box's Ollama listens on 11435 behind Caddy (11434); talk to it directly.
    ollama_host: "127.0.0.1:11435"
    local_llm_name: "qwen3:8b"
    qwen_model: "qwen3.8-max"
    # Phone turns must answer in seconds; the max model takes ~20s through OpenClaw.
    qwen_fast_model: "qwen3.8-flash"
    deepseek_model: "deepseek-v4-pro"
    deepseek_fast_model: "deepseek-flash"
    dashscope_base_url: "https://ws-4hta3ygc29v7zpo7.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
    tailscale_ip: "100.92.147.94"
    # US_DRIVER_LICENSE: matches phone digits, and the overlapping tags garble restored numbers.
    pii_entities_not_masked: [LOCATION, DATE_TIME, NRP, URL, US_DRIVER_LICENSE]
    # Reason: without this, models refuse to act on <PHONE_NUMBER_1> thinking the value is hidden.
    masked_values_note: >-
      Tags like <PERSON_1> or <PHONE_NUMBER_1> are real values, masked for privacy on the way to you
      and restored on the way back. Use them exactly as written, including in tool calls.
    tailscale_hostname: "arketyped.tail5a2469.ts.net"
    speaches_version: "latest-cpu"
    whisper_model: "Systran/faster-distil-whisper-small.en"
    kokoro_model: "speaches-ai/Kokoro-82M-v1.0-ONNX"
    kokoro_voice: "af_heart"
    kokoro_spanish_voice: "ef_dora"
    ha_version: "stable"
    wyoming_openai_version: "latest"
    timezone: "America/Chicago"
    # The -browser image ships Chromium, so the agent can browse and log into accounts (system_adr.md §6).
    openclaw_version: "latest-browser"
    # Off until the phone agent can't redial on its own (it looped on 2026-11-01).
    voice_calls_enabled: false
    aws_region: "us-east-1"
    vitals_python_version: "3.13-slim"
    comfyui_version: "cu128-slim"
    comfyui_gpu: "1"
    # FLUX.1 schnell (Apache 2.0), fp8 single-file checkpoint with its text encoders and VAE.
    comfyui_model_url: "https://huggingface.co/Comfy-Org/flux1-schnell/resolve/main/flux1-schnell-fp8.safetensors"
  vars_files:
    - secrets.yml

  become: yes
  tasks:
    - name: Step 2 — Presidio
      include_tasks: presidio.yml
      tags: [presidio]

    - name: Step 3 — LiteLLM
      include_tasks: litellm.yml
      tags: [litellm]

    - name: Step 4 — Speech (Whisper + Kokoro)
      include_tasks: speech.yml
      tags: [speech]

    - name: Step 5 — Home Assistant
      include_tasks: home_assistant.yml
      tags: [home_assistant]

    - name: Step 6 — OpenClaw
      include_tasks: openclaw.yml
      tags: [openclaw]

    - name: Step 7 — Vitals webhook
      include_tasks: vitals.yml
      tags: [vitals]

    - name: Step 8 — ComfyUI
      include_tasks: comfyui.yml
      tags: [comfyui]
