# Step 6 — OpenClaw gateway, the brain (system_adr.md §5).
# Its model is Qwen through LiteLLM (§1). Bound to the Tailscale IP
# (and localhost, for Home Assistant's fallback).

- name: Read the Home Assistant token for OpenClaw (made in step 5)
  slurp:
    src: "{{ docker_dir }}/home-assistant/config/.openclaw_token"
  register: ha_token_file
  no_log: true
  tags: [openclaw]

- name: Set the Home Assistant token
  set_fact:
    ha_openclaw_token: "{{ ha_token_file.content | b64decode }}"
  no_log: true
  tags: [openclaw]

- name: Create OpenClaw state directory
  file:
    path: "{{ docker_dir }}/openclaw/state"
    state: directory
    # Reason: the image runs as the node user, uid 1000.
    owner: "1000"
    group: "1000"
    mode: "0700"
  tags: [openclaw]

- name: Seed openclaw.json
  # Reason: OpenClaw rewrites its own config (migrations, doctor), so this only
  # seeds a fresh install. Later runs patch in just the keys we own, below.
  template:
    src: openclaw.json.j2
    dest: "{{ docker_dir }}/openclaw/state/openclaw.json"
    owner: "1000"
    group: "1000"
    mode: "0600"
    force: no
  register: openclaw_config
  tags: [openclaw]

- name: Copy OpenClaw docker-compose.yml
  template:
    src: openclaw-compose.yml.j2
    dest: "{{ docker_dir }}/openclaw/docker-compose.yml"
    mode: "0600"
  tags: [openclaw]

- name: Start OpenClaw
  command: docker compose up -d
  args:
    chdir: "{{ docker_dir }}/openclaw"
  register: openclaw_up
  changed_when: "'Started' in openclaw_up.stderr or 'Recreated' in openclaw_up.stderr"
  tags: [openclaw]

- name: Wait for OpenClaw's CLI after a (re)start
  # Reason: right after a start OpenClaw runs state maintenance and refuses CLI calls for minutes.
  command: docker exec openclaw-openclaw-1 node dist/index.js config get gateway.port
  register: openclaw_ready
  until: openclaw_ready.rc == 0
  retries: 60
  delay: 5
  changed_when: false
  tags: [openclaw]

- name: Check the voice-call plugin is installed
  command: docker exec openclaw-openclaw-1 node dist/index.js plugins list
  register: openclaw_plugins
  # Reason: right after a (re)start OpenClaw runs state maintenance and refuses CLI reads.
  until: openclaw_plugins.rc == 0
  retries: 20
  delay: 3
  changed_when: false
  tags: [openclaw]

- name: Install the voice-call plugin (Twilio)
  command: docker exec openclaw-openclaw-1 node dist/index.js plugins install @openclaw/voice-call
  when: "'voice-call' not in openclaw_plugins.stdout"
  tags: [openclaw]

- name: Create the phone agent's workspace
  file:
    path: "{{ docker_dir }}/openclaw/state/workspace-phone"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  tags: [openclaw]

- name: Copy the phone agent's instructions and bridge script
  # A lean agent for live calls: short prompt, fast model, two tools — so turns take seconds.
  template:
    src: "templates/phone-agent/{{ item.name }}"
    dest: "{{ docker_dir }}/openclaw/state/workspace-phone/{{ item.name }}"
    owner: "1000"
    group: "1000"
    mode: "{{ item.mode }}"
  loop:
    - {name: AGENTS.md, mode: "0644"}
    - {name: bridge-call, mode: "0755"}
  tags: [openclaw]

- name: Copy the virtual-card skill (privacy.com)
  copy:
    src: templates/skills/virtual-card/
    dest: "{{ docker_dir }}/openclaw/state/workspace/skills/virtual-card/"
    owner: "1000"
    group: "1000"
    mode: "0644"
  tags: [openclaw]

- name: Create OpenClaw's tools directory
  file:
    path: "{{ docker_dir }}/openclaw/state/tools"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  tags: [openclaw]

- name: Copy the bank skill (Plaid)
  copy:
    src: templates/skills/bank/
    dest: "{{ docker_dir }}/openclaw/state/workspace/skills/bank/"
    owner: "1000"
    group: "1000"
    mode: "0644"
  tags: [openclaw]

- name: Sync bank transactions daily
  cron:
    name: negotium bank sync
    hour: "6"
    minute: "0"
    job: docker exec openclaw-openclaw-1 node /home/node/.openclaw/workspace/skills/bank/plaid.mjs sync >/dev/null 2>&1
  tags: [openclaw]

- name: Copy the pangram skill
  copy:
    src: templates/skills/pangram/
    dest: "{{ docker_dir }}/openclaw/state/workspace/skills/pangram/"
    owner: "1000"
    group: "1000"
    mode: "0644"
  tags: [openclaw]

- name: Copy the aws skill
  copy:
    src: templates/skills/aws/
    dest: "{{ docker_dir }}/openclaw/state/workspace/skills/aws/"
    owner: "1000"
    group: "1000"
    mode: "0644"
  tags: [openclaw]

- name: Check the AWS CLI is installed for OpenClaw
  command: docker exec openclaw-openclaw-1 /home/node/.openclaw/tools/bin/aws --version
  register: aws_cli
  failed_when: false
  changed_when: false
  tags: [openclaw]

- name: Unpack the AWS CLI installer into OpenClaw's state
  # Reason: the image has no AWS CLI; installing under ~/.openclaw survives restarts and image updates.
  unarchive:
    src: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: "{{ docker_dir }}/openclaw/state/tools"
    remote_src: yes
    owner: "1000"
    group: "1000"
  when: aws_cli.rc != 0
  tags: [openclaw]

- name: Install the AWS CLI for OpenClaw
  command: >
    docker exec openclaw-openclaw-1 /home/node/.openclaw/tools/aws/install
    -i /home/node/.openclaw/tools/aws-cli -b /home/node/.openclaw/tools/bin
  when: aws_cli.rc != 0
  tags: [openclaw]

- name: Tell the main agent how to work
  lineinfile:
    path: "{{ docker_dir }}/openclaw/state/workspace/AGENTS.md"
    line: "{{ item }}"
  loop:
    - "{{ masked_values_note }}"
    - >-
      Phone calls are the phone agent's job: hand them over with sessions_spawn, agentId "phone",
      and a task naming who to call, their number, the goal and any account or confirmation numbers
      the phone menu may ask for, or the message to deliver and its language. Only dial numbers the
      owner gave you for this call. Never use
      voice_call yourself — whoever places a call also answers it, and only the phone agent knows how. It works the menu, waits on hold and connects the owner when a person answers;
      it never talks with people itself.
  tags: [openclaw]

- name: Read the live openclaw.json
  slurp:
    src: "{{ docker_dir }}/openclaw/state/openclaw.json"
  register: openclaw_live
  tags: [openclaw]

- name: Patch in the keys we own if they drifted
  # Reason: the model list is ours; replace it whole so removed models go too.
  command: >
    docker exec -i openclaw-openclaw-1 node dist/index.js config patch --stdin
    --replace-path models.providers.litellm.models
  args:
    stdin: "{{ lookup('template', 'openclaw.json.j2') }}"
  vars:
    live: "{{ openclaw_live.content | b64decode | from_json }}"
  when: live | combine(lookup('template', 'openclaw.json.j2') | from_json, recursive=True) != live
  register: openclaw_patch
  # Reason: right after a (re)start OpenClaw runs state maintenance and refuses config reads.
  until: openclaw_patch.rc == 0
  retries: 20
  delay: 3
  tags: [openclaw]

- name: Let the phone agent run only the bridge script
  # Reason: callers can say anything; exec stays limited to this one command.
  command: docker exec openclaw-openclaw-1 node dist/index.js approvals allowlist add --agent phone /home/node/.openclaw/workspace-phone/bridge-call
  register: phone_allowlist
  # Reason: runs before the restart below; right after one OpenClaw refuses CLI writes for minutes.
  until: phone_allowlist.rc == 0
  retries: 20
  delay: 3
  changed_when: false
  tags: [openclaw]

- name: Restart OpenClaw after a config change
  command: docker compose restart
  args:
    chdir: "{{ docker_dir }}/openclaw"
  when: (openclaw_config.changed or openclaw_patch.changed) and 'Started' not in openclaw_up.stderr
  tags: [openclaw]

- name: Check Tailscale Serve for OpenClaw
  command: tailscale serve status --json
  register: serve_status
  changed_when: false
  tags: [openclaw]

- name: Serve OpenClaw over HTTPS on the tailnet
  # Reason: the Android app needs wss:// for Tailscale hosts. Caddy holds 443, so 8443.
  command: tailscale serve --bg --https=8443 http://127.0.0.1:18789
  when: "':8443' not in serve_status.stdout"
  tags: [openclaw]

- name: Open the Twilio webhook to the internet
  # Reason: Twilio must reach the voice webhook; Funnel exposes only port 10000,
  # where the plugin (bound to localhost) checks Twilio's signature.
  command: tailscale funnel --bg --https=10000 http://127.0.0.1:3334
  when: "':10000' not in serve_status.stdout"
  tags: [openclaw]

- name: Verify OpenClaw answers
  uri:
    url: "http://{{ tailscale_ip }}:18789/v1/chat/completions"
    method: POST
    headers:
      Authorization: "Bearer {{ openclaw_gateway_token }}"
    body_format: json
    body:
      model: openclaw/main
      messages: [{role: user, content: "Reply with the single word: ready"}]
    timeout: 300
  register: openclaw_verify
  until: openclaw_verify.status == 200
  retries: 30
  delay: 5
  failed_when: "openclaw_verify.status != 200 or 'ready' not in (openclaw_verify.json.choices[0].message.content | lower)"
  changed_when: false
  tags: [openclaw]

- name: Verify OpenClaw is reachable over HTTPS
  uri:
    url: "https://{{ tailscale_hostname }}:8443/v1/chat/completions"
    method: POST
    headers:
      Authorization: "Bearer {{ openclaw_gateway_token }}"
    body_format: json
    body:
      model: openclaw/main
      messages: [{role: user, content: "Reply with the single word: ready"}]
    timeout: 300
  register: openclaw_https_verify
  failed_when: "'ready' not in (openclaw_https_verify.json.choices[0].message.content | lower)"
  changed_when: false
  tags: [openclaw]

- name: Send unmatched Home Assistant commands to OpenClaw
  command: docker exec -e HA_OWNER_PASSWORD -e OPENCLAW_GATEWAY_TOKEN home-assistant-home-assistant-1 python3 /config/negotium_setup.py fallback
  environment:
    HA_OWNER_PASSWORD: "{{ ha_owner_password }}"
    OPENCLAW_GATEWAY_TOKEN: "{{ openclaw_gateway_token }}"
  register: ha_fallback
  changed_when: (ha_fallback.stdout | from_json).changed
  tags: [openclaw]

- name: Verify Home Assistant reaches OpenClaw
  uri:
    url: http://127.0.0.1:8123/api/conversation/process
    method: POST
    headers:
      Authorization: "Bearer {{ ha_openclaw_token }}"
    body_format: json
    body:
      text: "Reply with the single word: ready"
      agent_id: conversation.openclaw_main
    timeout: 300
  register: ha_openclaw_verify
  failed_when: "'ready' not in (ha_openclaw_verify.json.response.speech.plain.speech | lower)"
  changed_when: false
  tags: [openclaw]

- name: Verify the bridge script sees its Twilio credentials
  command: docker exec openclaw-openclaw-1 /home/node/.openclaw/workspace-phone/bridge-call check
  register: bridge_check
  failed_when: bridge_check.stdout != "ready"
  changed_when: false
  tags: [openclaw]

- name: Verify the virtual-card skill reaches privacy.com
  command: docker exec openclaw-openclaw-1 node /home/node/.openclaw/workspace/skills/virtual-card/privacy-card.mjs check
  register: privacy_check
  failed_when: privacy_check.stdout != "ready"
  changed_when: false
  tags: [openclaw]

- name: Verify the agent's browser opens a page
  command: docker exec openclaw-openclaw-1 node dist/index.js browser open https://example.com
  register: browser_check
  failed_when: "'opened:' not in browser_check.stdout"
  changed_when: false
  tags: [openclaw]

- name: Verify OpenClaw can reach AWS
  command: docker exec openclaw-openclaw-1 /home/node/.openclaw/tools/bin/aws sts get-caller-identity --query Arn --output text
  register: aws_check
  failed_when: "'arn:aws:' not in aws_check.stdout"
  changed_when: false
  tags: [openclaw]

- name: Verify the bank skill reaches Plaid
  command: docker exec openclaw-openclaw-1 node /home/node/.openclaw/workspace/skills/bank/plaid.mjs check
  register: plaid_check
  failed_when: plaid_check.stdout != "ready"
  changed_when: false
  tags: [openclaw]

- name: Verify the pangram skill reaches Pangram
  command: docker exec openclaw-openclaw-1 node /home/node/.openclaw/workspace/skills/pangram/pangram.mjs check
  register: pangram_check
  failed_when: pangram_check.stdout != "ready"
  changed_when: false
  tags: [openclaw]
